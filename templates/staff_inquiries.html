{% extends "staff_base.html" %}{% block content %}<span class="eyebrow">CUSTOMER SERVICE</span><h1>Inquiries</h1><div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>Customer</th><th>Vehicle</th><th>Subject</th><th>Status</th><th></th></tr></thead><tbody>{% for i in inquiries %}<tr><td>{{i.inquiry_code}}</td><td>{{i.customer_name}}<br><small>{{i.phone}}</small></td><td>{{i.make_model}}</td><td>{{i.subject}}</td><td>{{i.status}}</td><td><a class="btn btn-sm btn-red" href="{{url_for('staff_inquiry_thread',inquiry_id=i.inquiry_id)}}">Open</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
