{% extends "staff_base.html" %}{% block content %}<span class="eyebrow">FLEET MANAGEMENT</span><h1>Vehicles</h1><div class="row g-4"><div class="col-xl-4"><div class="staff-card"><h4>Add Vehicle</h4><form method="post"><select name="vehicle_type" class="form-select mb-2"><option>Car</option><option>Motorcycle</option></select><input name="category" class="form-control mb-2" placeholder="Category" required><input name="make_model" class="form-control mb-2" placeholder="Make / model" required><input name="plate_number" class="form-control mb-2" placeholder="Plate number" required><input name="location" class="form-control mb-2" placeholder="Location" required><div class="row g-2"><div class="col-6"><input name="passenger_capacity" type="number" min="1" class="form-control mb-2" placeholder="Capacity" required></div><div class="col-6"><input name="price_per_day" type="number" step="0.01" class="form-control mb-2" placeholder="Price/day" required></div></div><select name="status" class="form-select mb-2"><option>Available</option><option>On Rent</option><option>Maintenance</option></select><input name="transmission" class="form-control mb-2" value="Automatic"><input name="fuel_type" class="form-control mb-2" value="Gasoline"><input name="image_url" class="form-control mb-2" placeholder="Image URL" required><textarea name="description" class="form-control mb-3" placeholder="Description"></textarea><button class="btn btn-red w-100">Add Vehicle</button></form></div></div><div class="col-xl-8">{% for v in vehicles %}<div class="staff-card mb-3"><div class="row g-3 align-items-center"><div class="col-md-3"><img src="{{v.image_url}}" class="fleet-thumb"></div><div class="col-md-5"><b>{{v.make_model}}</b><br><small>{{v.vehicle_type}} · {{v.category}} · {{v.plate_number}}<br>Rented {{v.rental_count}}×</small></div><div class="col-md-4"><form method="post" action="{{url_for('update_vehicle',vehicle_id=v.vehicle_id)}}"><input name="price_per_day" value="{{v.price_per_day}}" class="form-control form-control-sm mb-1"><input name="location" value="{{v.location}}" class="form-control form-control-sm mb-1"><input name="passenger_capacity" value="{{v.passenger_capacity}}" class="form-control form-control-sm mb-1"><select name="status" class="form-select form-select-sm mb-1">{% for s in ['Available','On Rent','Maintenance'] %}<option {% if v.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><label class="small"><input type="checkbox" name="is_published" {% if v.is_published %}checked{% endif %}> Published</label><button class="btn btn-sm btn-red w-100">Update</button></form></div></div></div>{% endfor %}</div></div>{% endblock %}
