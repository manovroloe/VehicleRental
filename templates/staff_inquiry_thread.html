{% extends "staff_base.html" %}{% block content %}<span class="eyebrow">{{inquiry.inquiry_code}}</span><h1>{{inquiry.subject}}</h1><p>{{inquiry.customer_name}} · {{inquiry.email}} · {{inquiry.phone}} · {{inquiry.make_model}}</p><div class="chat-body staff-chat">{% for m in messages %}<div class="message {% if m.sender_type=='Agent' %}agent{% else %}customer{% endif %}"><small>{{m.sender_type}}</small><p>{{m.message}}</p></div>{% endfor %}</div><form method="post" class="row g-2 mt-3"><div class="col-md-9"><textarea name="message" class="form-control" required></textarea></div><div class="col-md-3 d-grid"><button class="btn btn-red">Reply as Agent</button></div></form><form method="post" class="mt-2"><input type="hidden" name="action" value="close"><button class="btn btn-sm btn-outline-secondary">Close Inquiry</button></form>{% endblock %}
