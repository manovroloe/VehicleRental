{% extends "base.html" %}{% block content %}<div class="container py-5"><div class="chat-shell"><div class="form-head"><span class="eyebrow light">{{inquiry.inquiry_code}}</span><h3>{{inquiry.subject}}</h3><small>{{inquiry.make_model}} · {{inquiry.status}}</small></div><div class="chat-body">{% for m in messages %}<div class="message {% if m.sender_type=='Customer' %}customer{% else %}agent{% endif %}"><small>{{m.sender_type}}</small><p>{{m.message}}</p></div>{% endfor %}</div>{% if inquiry.status!='Closed' %}<form method="post" class="chat-form"><textarea name="message" class="form-control" required></textarea><button class="btn btn-red">Send</button></form>{% endif %}</div></div>{% endblock %}
